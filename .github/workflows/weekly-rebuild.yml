# Rebuilds and redeploys the site every Monday, on every push, or on demand.
# What "self-updating" means here:
#  - venue of the week rotates, lucky-date pages roll forward to the new year
#  - passed lucky dates drop off; sitemap dates change only when content does
#  - new rows in your Google Sheet (if configured) become venue pages
#  - every 6 months a GitHub Issue reminds you which venue prices to re-check
name: Build & deploy (weekly self-update)

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 13 * * 1"   # Mondays 13:17 UTC (~6 a.m. Las Vegas)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build site
        run: node build.mjs
      - name: Remind me if venue facts are getting stale
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s stale-report.md ]; then
            open=$(gh issue list --state open --search "in:title Venue fact check due" --json number --jq length)
            if [ "$open" = "0" ]; then
              gh issue create --title "Venue fact check due" --body-file stale-report.md
            fi
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Tell Bing (which also feeds ChatGPT search and Copilot) that pages changed.
      # Only on real content pushes, never on the weekly timer.
      - name: Ping IndexNow
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          sleep 20
          curl -fsS "${{ steps.deployment.outputs.page_url }}indexnow.json" -o payload.json
          curl -fsS -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json; charset=utf-8" --data-binary @payload.json
